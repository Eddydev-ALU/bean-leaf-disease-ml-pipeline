events { worker_connections 2048; }

http {
    # Docker's embedded DNS resolves the compose service name 'api' to the IP of
    # every replica. `resolve` + a short TTL means `--scale api=N` is picked up
    # without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_backend {
        least_conn;                 # send each request to the least busy replica
        zone api_zone 64k;
        server api:8000 resolve max_fails=3 fail_timeout=15s;
    }

    client_max_body_size 200M;      # bulk / zip uploads

    log_format perf '$remote_addr $request "$status" '
                   'upstream=$upstream_addr '
                   'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /var/log/nginx/access.log perf;

    server {
        listen 8000;

        location / {
            proxy_pass         http://api_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout    900s;   # retraining is long-running
        }
    }
}
