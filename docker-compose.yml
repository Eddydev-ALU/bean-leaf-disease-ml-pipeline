services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      - MODEL_DIR=/app/models
      - DATA_DIR=/app/data
      - RETRAIN_THRESHOLD=20
      - ACC_FLOOR=0.80
    volumes:
      - ./data:/app/data       # uploaded images persist on the host
      - ./models:/app/models   # retrained model versions persist on the host
    expose:
      - "8000"                 # internal only — nginx is the entry point
    deploy:
      resources:
        limits:
          cpus: '1.0'          # pin CPU per replica so the Locust scaling test is fair
          memory: 2G
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"            # single entry point, load-balanced across api replicas
    depends_on:
      - api
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    environment:
      - API_URL=http://nginx:8000
    ports:
      - "8501:8501"
    depends_on:
      - nginx
    restart: unless-stopped
